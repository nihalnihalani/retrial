name: CI

# Credential-free CI (ported from the Rewind repo): the engine suite runs with
# the Daytona SDK fully mocked, the UI builds in replay mode. The separate
# retrial.yml workflow is a MANUAL live-Daytona dispatch job, not CI.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests (Daytona mocked — no credentials needed)
        run: python -m pytest tests/ -q

  web:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        # npm install (not ci): the lockfile is generated on macOS and npm's
        # cross-platform optional-deps bug (npm/cli#4828) makes `npm ci` fail
        # on the Linux runner over wasm/platform-specific optional entries.
        run: npm install --no-audit --no-fund
      - name: Build (replay mode — no backend needed)
        run: npm run build
      - name: Test (F7b — sacred default-replay guard)
        run: npm test
